version: "3.9"

services:
  web:
    image: dam-platform-web:latest
    ports:
      - "5173:80"
    deploy:
      replicas: 1

  api:
    image: dam-platform-api:latest
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://dam:dam@postgres:5432/dam?schema=public
    ports:
      - "3000:3000"
    deploy:
      replicas: 1

  worker:
    image: dam-platform-worker:latest
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://dam:dam@postgres:5432/dam?schema=public
    deploy:
      replicas: 1

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: dam
      POSTGRES_DB: dam
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: dam
      RABBITMQ_DEFAULT_PASS: dam
    ports:
      - "15672:15672"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: damadmin
      MINIO_ROOT_PASSWORD: damadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
