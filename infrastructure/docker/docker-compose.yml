services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dam}:${POSTGRES_PASSWORD:-dam}@postgres:5432/${POSTGRES_DB:-dam}?schema=${DATABASE_SCHEMA:-public}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-dam}:${RABBITMQ_DEFAULT_PASS:-dam}@rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dam}:${POSTGRES_PASSWORD:-dam}@postgres:5432/${POSTGRES_DB:-dam}?schema=${DATABASE_SCHEMA:-public}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-dam}:${RABBITMQ_DEFAULT_PASS:-dam}@rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      REDIS_URL: redis://redis:6379
    depends_on:
      - rabbitmq
      - minio
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dam}
      POSTGRES_DB: ${POSTGRES_DB:-dam}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-dam}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-dam}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-damadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-damadmin123}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  postgres_data:
  minio_data:
  redis_data:
